version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ai-query-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: testdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ai-query-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  parent-service:
    build:
      context: .
      dockerfile: parent-service/Dockerfile
    container_name: ai-query-parent
    environment:
      GRPC_PORT: 9090
      REST_PORT: 8090
    ports:
      - "9090:9090"
      - "8090:8090"
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ai-query-dashboard
    ports:
      - "3000:80"
    depends_on:
      - parent-service
    restart: unless-stopped

  sidecar:
    build:
      context: .
      dockerfile: sidecar/Dockerfile
    container_name: ai-query-sidecar
    environment:
      # Database config
      DB_TYPE: ${DB_TYPE:-mysql}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: testdb
      # AI Provider config
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL_ID: ${AI_MODEL_ID:-qwen2.5-coder:7b}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.containers.internal:11434}
      # AWS Bedrock config (if using bedrock)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      # Server config
      SERVER_PORT: 8080
      # Parent service config
      PARENT_ENABLED: "true"
      PARENT_ADDRESS: parent-service:9090
      # Sidecar identity
      TEAM_ID: ${TEAM_ID:-demo-team}
      SERVICE_NAME: ${SERVICE_NAME:-demo-service}
      SIDECAR_VERSION: "1.0.0"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      parent-service:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
