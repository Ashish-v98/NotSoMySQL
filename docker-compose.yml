version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ai-query-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: testdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ai-query-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  localstack:
    image: localstack/localstack:latest
    container_name: ai-query-localstack
    environment:
      SERVICES: s3
      DEBUG: 1
      DATA_DIR: /tmp/localstack/data
      AWS_DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: 1
    ports:
      - "4566:4566"
      - "4571:4571"
    volumes:
      - localstack_data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack-init:
    image: amazon/aws-cli:latest
    container_name: ai-query-localstack-init
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
    command: >
      sh -c "
        echo 'Waiting for LocalStack...' &&
        while ! aws --endpoint-url=http://localstack:4566 s3 ls 2>/dev/null; do sleep 1; done &&
        echo 'Creating S3 bucket: ai-query-results' &&
        aws --endpoint-url=http://localstack:4566 s3 mb s3://ai-query-results &&
        echo 'LocalStack initialization complete!'
      "
    depends_on:
      localstack:
        condition: service_healthy

  parent-service:
    build:
      context: .
      dockerfile: parent-service/Dockerfile
    container_name: ai-query-parent
    environment:
      GRPC_PORT: 9090
      REST_PORT: 8090
      # S3 config for LocalStack
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: ai-query-results
    ports:
      - "9090:9090"
      - "8090:8090"
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ai-query-dashboard
    ports:
      - "3000:80"
    depends_on:
      - parent-service
    restart: unless-stopped

  sidecar:
    build:
      context: .
      dockerfile: sidecar/Dockerfile
    container_name: ai-query-sidecar
    environment:
      # Database config
      DB_TYPE: ${DB_TYPE:-mysql}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: testdb
      # AI Provider config
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL_ID: ${AI_MODEL_ID:-qwen2.5-coder:7b}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.containers.internal:11434}
      # AWS/LocalStack config
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # S3 config
      S3_BUCKET: ai-query-results
      S3_REGION: us-east-1
      S3_RESULT_SIZE_LIMIT: 1048576
      # Server config
      SERVER_PORT: 8080
      GRPC_PORT: 8080
      # Parent service config
      PARENT_ENABLED: "true"
      PARENT_ADDRESS: parent-service:9090
      # Sidecar identity
      TEAM_ID: ${TEAM_ID:-demo-team}
      SERVICE_NAME: ${SERVICE_NAME:-demo-service}
      SIDECAR_VERSION: "1.0.0"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy
      parent-service:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
  localstack_data:
